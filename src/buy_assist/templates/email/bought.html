<div style="font-family: system-ui, sans-serif; max-width: 36rem">
<h2 style="font-size: 1.15rem">{% if item_url %}<a href="{{ item_url }}">{{ item.name }}</a>{% else %}{{ item.name }}{% endif %}</h2>
<p>{{ buyer }} bought it for ${{ price }} all-in, so its alerts have stopped.</p>

{% include "email/_footer.html" %}</div>
