[project]
name = "buy-assist"
version = "0.1.0"
description = "Finds listings for things the household wants to buy and tracks their prices"
readme = "README.md"
authors = [
    { name = "robo-carver", email = "robocarver@worldofmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
buy-assist = "buy_assist.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "httpx2>=2.13.1",
    "hypothesis>=6.170.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real external services (claude-json, network); run with -m live"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
